name: Run Tests
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "changelog.d/**"
      - ".codex/**"
      - ".vscode/**"
      - ".gitignore"
  pull_request:
    branches: [ "**" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "changelog.d/**"
      - ".codex/**"
      - ".vscode/**"
      - ".gitignore"
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"

env:
  PRIMARY_PYTHON_VERSION: "3.15"

jobs:
  test:
    runs-on: ubuntu-26.04
    
    strategy:
      matrix:
        python-version: ["3.15"]
    
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv sync --locked --dev --all-extras

    - name: Check changelog fragment
      if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        uv run --locked towncrier check --compare-with "origin/${BASE_REF}"
    
    - name: Run unit tests
      uses: ./.github/actions/test-health
      with:
        profile: unit
        report: test-results/unit.xml
      timeout-minutes: 30

    - name: Run component tests
      uses: ./.github/actions/test-health
      with:
        profile: component
        report: test-results/component.xml
      timeout-minutes: 30

    - name: Run integration tests
      uses: ./.github/actions/test-health
      with:
        profile: integration
        report: test-results/integration.xml
      timeout-minutes: 30

    - name: Run one reproducible shuffled suite
      env:
        TEST_COMMIT: ${{ github.sha }}
      run: |
        seed=$(uv run --locked python -c "import os; print(int(os.environ['TEST_COMMIT'][:8], 16))")
        uv run --locked python tools/check_test_health.py run --profile all --seed "$seed" --report test-results/random.xml
      timeout-minutes: 15

    - name: Verify test configuration cleanup
      if: always()
      run: |
        if [ -e src/config.toml ]; then
          echo "pytest left src/config.toml behind" >&2
          exit 1
        fi
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          .pytest_cache/
          src/content/logs/
          test_logs/
          test-results/
        retention-days: 7

  redis-provider-behavior:
    runs-on: ubuntu-26.04
    services:
      redis:
        image: redis:8.2.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Python ${{ env.PRIMARY_PYTHON_VERSION }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PRIMARY_PYTHON_VERSION }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "latest"

    - name: Install Redis provider test dependencies
      run: uv sync --locked --dev --extra cluster --extra ext-scheduling-cluster

    - name: Run real Redis provider behavior tests
      env:
        CFMS_TEST_REDIS_URL: "redis://127.0.0.1:6379/0"
      uses: ./.github/actions/test-health
      with:
        profile: redis
        report: test-results/redis.xml
      timeout-minutes: 30

    - name: Upload Redis test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: redis-test-results
        path: test-results/
        retention-days: 7

  mysql-database-migration:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        mysql-version: ["8.4", "9.7"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_DATABASE: cfms_migration
          MYSQL_USER: cfms
          MYSQL_PASSWORD: cfms-test-password
          MYSQL_ROOT_PASSWORD: cfms-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pcfms-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Python ${{ env.PRIMARY_PYTHON_VERSION }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PRIMARY_PYTHON_VERSION }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "latest"

    - name: Install test and MySQL dependencies
      run: uv sync --locked --dev --extra mysql

    - name: Run MySQL integration tests
      env:
        CFMS_TEST_MYSQL_URL: "mysql+mysqlconnector://cfms:cfms-test-password@127.0.0.1:3306/cfms_migration?charset=utf8mb4"
      uses: ./.github/actions/test-health
      with:
        profile: mysql-${{ matrix.mysql-version }}
        report: test-results/mysql.xml
      timeout-minutes: 30

    - name: Upload MySQL test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: mysql-test-results-${{ matrix.mysql-version }}
        path: test-results/
        retention-days: 7

  postgresql-scheduling-concurrency:
    runs-on: ubuntu-26.04
    services:
      postgresql:
        image: postgres:18
        env:
          POSTGRES_DB: cfms_scheduling
          POSTGRES_USER: cfms
          POSTGRES_PASSWORD: cfms-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cfms -d cfms_scheduling"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Python ${{ env.PRIMARY_PYTHON_VERSION }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PRIMARY_PYTHON_VERSION }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "latest"

    - name: Install test and PostgreSQL dependencies
      run: uv sync --locked --dev --extra postgresql

    - name: Run PostgreSQL scheduling concurrency tests
      env:
        CFMS_TEST_POSTGRESQL_URL: "postgresql+psycopg2://cfms:cfms-test-password@127.0.0.1:5432/cfms_scheduling"
      uses: ./.github/actions/test-health
      with:
        profile: postgresql
        report: test-results/postgresql.xml
      timeout-minutes: 30

    - name: Upload PostgreSQL test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: postgresql-test-results
        path: test-results/
        retention-days: 7

  s3-provider-behavior:
    runs-on: ubuntu-26.04
    services:
      s3:
        image: chrislusf/seaweedfs:4.53
        ports:
          - 8333:8333
        env:
          AWS_ACCESS_KEY_ID: cfms-test
          AWS_SECRET_ACCESS_KEY: cfms-test-secret
          S3_BUCKET: cfms-test
    env:
      AWS_ACCESS_KEY_ID: cfms-test
      AWS_SECRET_ACCESS_KEY: cfms-test-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      CFMS_TEST_S3_WRITE: "1"
      CFMS_TEST_S3_BUCKET: cfms-test
      CFMS_TEST_S3_ENDPOINT_URL: http://127.0.0.1:8333
      CFMS_TEST_S3_REGION: us-east-1
      CFMS_TEST_S3_ADDRESSING_STYLE: path
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --dev --extra cluster
      - name: Wait for the dedicated S3 bucket
        run: |
          uv run --locked python tools/check_test_health.py wait-s3
      - name: Check real S3 behavior
        uses: ./.github/actions/test-health
        with:
          profile: s3
          report: test-results/s3.xml
        timeout-minutes: 10
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: s3-test-results
          path: test-results/
          retention-days: 7

  first-daily:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 17, 101]
    services:
      redis:
        image: redis:8.2.10-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10
      mysql:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: cfms_test
          MYSQL_USER: cfms
          MYSQL_PASSWORD: cfms-test-password
          MYSQL_ROOT_PASSWORD: cfms-test-password
        options: --health-cmd="mysqladmin ping -h localhost -pcfms-test-password" --health-interval=10s --health-timeout=5s --health-retries=10
      postgresql:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: cfms_test
          POSTGRES_USER: cfms
          POSTGRES_PASSWORD: cfms-test-password
        options: --health-cmd="pg_isready -U cfms -d cfms_test" --health-interval=10s --health-timeout=5s --health-retries=10
      s3:
        image: chrislusf/seaweedfs:4.53
        ports:
          - 8333:8333
        env:
          AWS_ACCESS_KEY_ID: cfms-test
          AWS_SECRET_ACCESS_KEY: cfms-test-secret
          S3_BUCKET: cfms-test
    env:
      CFMS_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      CFMS_TEST_MYSQL_URL: mysql+mysqlconnector://cfms:cfms-test-password@127.0.0.1:3306/cfms_test?charset=utf8mb4
      CFMS_TEST_POSTGRESQL_URL: postgresql+psycopg2://cfms:cfms-test-password@127.0.0.1:5432/cfms_test
      AWS_ACCESS_KEY_ID: cfms-test
      AWS_SECRET_ACCESS_KEY: cfms-test-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      CFMS_TEST_S3_WRITE: "1"
      CFMS_TEST_S3_BUCKET: cfms-test
      CFMS_TEST_S3_ENDPOINT_URL: http://127.0.0.1:8333
      CFMS_TEST_S3_ADDRESSING_STYLE: path
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --dev --all-extras
      - run: uv run --locked python tools/check_test_health.py wait-s3
      - name: Verify shuffled suite with real backends
        run: uv run --locked python tools/check_test_health.py run --profile all --seed ${{ matrix.seed }} --report test-results/daily.xml
        timeout-minutes: 20
      - name: Verify independent protocol cases
        run: uv run --locked python tools/check_test_health.py isolate --report test-results/isolated.xml
        timeout-minutes: 10
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: first-daily-${{ matrix.seed }}
          path: |
            test-results/
            test_logs/
          retention-days: 7

  release-bundle-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-latest]

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Python ${{ env.PRIMARY_PYTHON_VERSION }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PRIMARY_PYTHON_VERSION }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "latest"

    - name: Install release smoke dependencies
      run: uv sync --locked --dev
      timeout-minutes: 10

    - name: Test Windows file writeability
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: uv run --locked --no-sync pytest tests/database/test_file_writeable.py -q
      timeout-minutes: 3

    - name: Build and inspect a flat release deployment
      shell: pwsh
      run: |
        $version = uv run --locked --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
        uv run --locked --no-sync python tools/build_release.py --version $version --source-date-epoch 1788000000 --output-dir dist
        $archive = (Resolve-Path "dist/cfms-on-websocket-$version.zip").Path
        Expand-Archive -LiteralPath $archive -DestinationPath smoke
        $bundle = (Resolve-Path "smoke/cfms-on-websocket-$version").Path
        uv sync --project $bundle --locked --no-dev
        Copy-Item -LiteralPath (Join-Path $bundle "src/config.toml.sample") -Destination (Join-Path $bundle "src/config.toml")
        uv run --project $bundle --no-dev maintain deployment status --deployment-root $bundle
