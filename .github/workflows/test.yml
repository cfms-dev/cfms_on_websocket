name: Run Tests
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.14"]
    
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.11.16"
    
    - name: Install dependencies
      run: |
        uv sync --locked --dev --all-extras

    - name: Check changelog fragment
      if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        uv run --locked towncrier check --compare-with "origin/${BASE_REF}"
    
    - name: Prepare test environment
      run: |
        cp src/config.toml.sample config.toml
        mkdir -p src/content/ssl
        mkdir -p src/content/logs
    
    - name: Run tests with pytest
      run: |
        uv run pytest tests/ -v --tb=short
      timeout-minutes: 10
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          .pytest_cache/
          src/content/logs/
          test_logs/
        retention-days: 7

  mysql-database-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cfms_migration
          MYSQL_USER: cfms
          MYSQL_PASSWORD: cfms-test-password
          MYSQL_ROOT_PASSWORD: cfms-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pcfms-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.11.16"

    - name: Install test and MySQL dependencies
      run: uv sync --locked --dev --extra mysql

    - name: Run bidirectional database migration tests
      env:
        CFMS_TEST_MYSQL_URL: "mysql+mysqlconnector://cfms:cfms-test-password@127.0.0.1:3306/cfms_migration?charset=utf8mb4"
      run: uv run --locked pytest tests/maintenance/test_database_migration_mysql.py -q
      timeout-minutes: 10
