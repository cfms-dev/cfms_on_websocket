name: Publish Release Bundle

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-tests:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run-tests: ${{ steps.resolve.outputs.run-tests }}

    steps:
      - name: Resolve tests for release commit
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          find_test_run() {
            gh api --method GET \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GH_REPO}/actions/workflows/test.yml/runs" \
              -f head_sha="${GITHUB_SHA}" \
              -f per_page=100 \
              --jq '(
                [
                  .workflow_runs[] |
                  select(.event == "push" or .event == "workflow_call") |
                  select(.conclusion == "success")
                ][0] //
                [
                  .workflow_runs[] |
                  select(.event == "push" or .event == "workflow_call") |
                  select(.status != "completed")
                ][0] //
                [
                  .workflow_runs[] |
                  select(.event == "push" or .event == "workflow_call")
                ][0]
              ) | select(. != null) |
              [.id, .status, (.conclusion // ""), .html_url] | @tsv'
          }

          run=""
          for attempt in {1..6}; do
            run="$(find_test_run)"
            if [[ -n "${run}" ]]; then
              break
            fi

            if (( attempt < 6 )); then
              echo "Test run is not registered yet; retrying in 5 seconds (${attempt}/5)."
              sleep 5
            fi
          done

          if [[ -z "${run}" ]]; then
            echo "No existing test run found for ${GITHUB_SHA}; the release will run tests."
            echo "run-tests=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          IFS=$'\t' read -r run_id status conclusion run_url <<< "${run}"
          if [[ "${status}" != "completed" ]]; then
            echo "Waiting for the existing test run: ${run_url}"
            gh run watch "${run_id}" --exit-status
          elif [[ "${conclusion}" != "success" ]]; then
            echo "The existing test run did not succeed (${conclusion}): ${run_url}" >&2
            exit 1
          fi

          echo "Reusing the successful test run: ${run_url}"
          echo "run-tests=false" >> "${GITHUB_OUTPUT}"

  test:
    needs: resolve-tests
    if: needs.resolve-tests.outputs.run-tests == 'true'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      pull-requests: read

  release:
    needs: [resolve-tests, test]
    if: >-
      always() &&
      needs.resolve-tests.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vX.Y.Z format: ${tag}" >&2
            exit 1
          fi

          version="${tag#v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "${version}" != "${project_version}" ]]; then
            echo "Tag version ${version} does not match project version ${project_version}" >&2
            exit 1
          fi

          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${GITHUB_SHA}")" >> "${GITHUB_ENV}"

      - name: Validate synchronized release metadata
        run: >-
          python tools/manage_release.py check "${VERSION}"
          --notes-output "${RUNNER_TEMP}/release-notes.md"

      - name: Build release archives
        run: >-
          python tools/build_release.py
          --version "${VERSION}"
          --source-date-epoch "${SOURCE_DATE_EPOCH}"
          --output-dir dist

      - name: Verify checksums and archive contents
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)

          mkdir -p smoke/zip smoke/tar
          unzip -q "dist/cfms-on-websocket-${VERSION}.zip" -d smoke/zip
          tar -xzf "dist/cfms-on-websocket-${VERSION}.tar.gz" -C smoke/tar
          diff -qr smoke/zip smoke/tar

      - name: Smoke-test the deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="${GITHUB_WORKSPACE}/smoke/zip/cfms-on-websocket-${VERSION}"
          uv sync --project "${bundle_root}" --locked --no-dev
          cp "${bundle_root}/src/config.toml.sample" "${bundle_root}/src/config.toml"
          uv run --project "${bundle_root}" --no-dev python -m compileall -q "${bundle_root}/src"
          (
            cd "${bundle_root}"
            uv run --project "${bundle_root}" --no-dev maintain extension list >/dev/null
          )

          uv run --project "${bundle_root}" --no-dev maintain deployment status \
            --deployment-root "${bundle_root}"
          (
            cd "${bundle_root}/src"
            uv run --project "${bundle_root}" --no-dev alembic --version
            uv run --project "${bundle_root}" --no-dev python -c "import main; import maintenance.cli"
            uv run --project "${bundle_root}" --no-dev python -c \
              "from importlib.util import find_spec; assert find_spec('pytest') is None"
          )

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          assets=(
            "dist/cfms-on-websocket-${VERSION}.zip"
            "dist/cfms-on-websocket-${VERSION}.tar.gz"
            "dist/SHA256SUMS.txt"
          )

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
            gh release edit "${tag}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --title "${tag}"
          else
            gh release create "${tag}" "${assets[@]}" \
              --verify-tag \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --title "${tag}"
          fi
