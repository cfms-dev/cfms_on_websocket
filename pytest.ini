[pytest]
# Pytest configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output settings
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config

# Asyncio configuration
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    component: exercises real in-process database or storage boundaries
    stress: marks stress/load tests

# Last-resort watchdog, including fixture setup and teardown.
timeout = 120

# Coverage settings (if pytest-cov is installed)
# --cov=include
# --cov-report=html
# --cov-report=term-missing
